service: 1bt-resource-management

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 512
  timeout: 30
  
  # Environment variables (loaded from config files)
  environment:
    NODE_ENV: ${self:custom.environment.NODE_ENV}
    DATABASE_HOST: ${self:custom.environment.DATABASE_HOST}
    DATABASE_PORT: ${self:custom.environment.DATABASE_PORT}
    DATABASE_NAME: ${self:custom.environment.DATABASE_NAME}
    DATABASE_USER: ${self:custom.environment.DATABASE_USER}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    S3_BUCKET_DOCUMENTS: !Ref DocumentsBucket
    ENCRYPTION_KEY: ${self:custom.environment.ENCRYPTION_KEY}
    LOG_LEVEL: ${self:custom.environment.LOG_LEVEL}
  
  # IAM Role statements
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
          Resource: !GetAtt CognitoUserPool.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - !Sub ${DocumentsBucket.Arn}/*
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: !Ref DatabaseSecret
        - Effect: Allow
          Action:
            - rds:DescribeDBInstances
            - rds:StartDBInstance
            - rds:StopDBInstance
          Resource: '*'
  
  # VPC Configuration (for RDS access)
  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds: ${self:custom.environment.SUBNET_IDS}

  # API Gateway settings
  apiGateway:
    shouldStartNameWithService: true
    minimumCompressionSize: 1024

# Custom variables per environment
custom:
  environment: ${file(./infrastructure/parameters/${self:provider.stage}.yml)}
  
  # Serverless plugins config
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
  
  # Bundle config for esbuild (optional optimization)
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - aws-sdk
    target: node20
    platform: node

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

# Package configuration
package:
  individually: true
  patterns:
    - '!.git/**'
    - '!.gitignore'
    - '!.env*'
    - '!tests/**'
    - '!docs/**'
    - '!*.md'
    - '!infrastructure/**'
    - '!database/**'
    - '!python_src/**'

# Lambda Functions
functions:
  # ============================================
  # AUTH Handler
  # ============================================
  authHandler:
    handler: src/handlers/auth/index.handler
    description: Authentication operations (login, logout, refresh)
    events:
      - http:
          path: /api/v1/auth/login
          method: post
          cors: true
      - http:
          path: /api/v1/auth/logout
          method: post
          cors: true
      - http:
          path: /api/v1/auth/refresh
          method: post
          cors: true
      - http:
          path: /api/v1/auth/forgot-password
          method: post
          cors: true
      - http:
          path: /api/v1/auth/reset-password
          method: post
          cors: true

  # ============================================
  # RESOURCES Handler (Employees)
  # ============================================
  resourceHandler:
    handler: src/handlers/resources/index.handler
    description: Resource (Employee) CRUD operations
    events:
      - http:
          path: /api/v1/resources
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources/{id}/allocations
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/resources/{id}/designation-history
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # PROJECTS Handler
  # ============================================
  projectHandler:
    handler: src/handlers/projects/index.handler
    description: Project CRUD operations
    events:
      - http:
          path: /api/v1/projects
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/projects
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/projects/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/projects/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/projects/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # CLIENTS Handler
  # ============================================
  clientHandler:
    handler: src/handlers/clients/index.handler
    description: Client CRUD operations
    events:
      - http:
          path: /api/v1/clients
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/clients
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/clients/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/clients/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/clients/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # ALLOCATIONS Handler
  # ============================================
  allocationHandler:
    handler: src/handlers/allocations/index.handler
    description: Allocation management
    events:
      - http:
          path: /api/v1/allocations
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/allocations
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/allocations/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/allocations/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/allocations/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/allocations/resource/{resourceId}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # DESIGNATIONS Handler
  # ============================================
  designationHandler:
    handler: src/handlers/designations/index.handler
    description: Designation management
    events:
      - http:
          path: /api/v1/designations
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/designations
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/designations/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # TRACKS Handler
  # ============================================
  trackHandler:
    handler: src/handlers/tracks/index.handler
    description: Track management
    events:
      - http:
          path: /api/v1/tracks
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/tracks
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/tracks/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # USERS Handler
  # ============================================
  userHandler:
    handler: src/handlers/users/index.handler
    description: User management
    events:
      - http:
          path: /api/v1/users
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/users
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/users/{id}
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/users/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/users/{id}/permissions
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/users/{id}/permissions
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # REPORTS Handler
  # ============================================
  reportHandler:
    handler: src/handlers/reports/index.handler
    description: Dashboard and reports
    events:
      - http:
          path: /api/v1/reports/dashboard
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/reports/utilization
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer
      - http:
          path: /api/v1/reports/billing
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref ApiGatewayAuthorizer

  # ============================================
  # RDS Scheduler (Start/Stop)
  # ============================================
  rdsSchedulerStart:
    handler: src/handlers/scheduler/rdsScheduler.start
    description: Start RDS instance (7 AM IST)
    events:
      - schedule:
          rate: cron(30 1 ? * MON-FRI *)  # 7 AM IST = 1:30 AM UTC
          enabled: ${self:custom.environment.RDS_SCHEDULER_ENABLED}

  rdsSchedulerStop:
    handler: src/handlers/scheduler/rdsScheduler.stop
    description: Stop RDS instance (9 PM IST)
    events:
      - schedule:
          rate: cron(30 15 ? * MON-FRI *)  # 9 PM IST = 3:30 PM UTC
          enabled: ${self:custom.environment.RDS_SCHEDULER_ENABLED}

# CloudFormation Resources
resources:
  Resources:
    # ============================================
    # COGNITO USER POOL
    # ============================================
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: 1bt-resource-users-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        UsernameConfiguration:
          CaseSensitive: false
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: role
            AttributeDataType: String
            Mutable: true
        UserPoolTags:
          Environment: ${self:provider.stage}
          Project: 1BT-Resource-Management

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: 1bt-web-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # ============================================
    # API GATEWAY AUTHORIZER
    # ============================================
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer-${self:provider.stage}
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - !GetAtt CognitoUserPool.Arn

    # ============================================
    # S3 BUCKET - Documents
    # ============================================
    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: 1bt-documents-${self:provider.stage}-${aws:accountId}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 90
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}

    # ============================================
    # SECRETS MANAGER - Database Credentials
    # ============================================
    DatabaseSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: 1bt-db-credentials-${self:provider.stage}
        Description: Database credentials for 1BT Resource Management
        SecretString: !Sub |
          {
            "username": "${self:custom.environment.DATABASE_USER}",
            "password": "${self:custom.environment.DATABASE_PASSWORD}",
            "host": "${self:custom.environment.DATABASE_HOST}",
            "port": "${self:custom.environment.DATABASE_PORT}",
            "dbname": "${self:custom.environment.DATABASE_NAME}"
          }
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}

    # ============================================
    # VPC SECURITY GROUP
    # ============================================
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Lambda functions
        GroupName: 1bt-lambda-sg-${self:provider.stage}
        VpcId: ${self:custom.environment.VPC_ID}
        SecurityGroupEgress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: 0.0.0.0/0
            Description: PostgreSQL access
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
            Description: HTTPS for AWS services
          - IpProtocol: tcp
            FromPort: 6379
            ToPort: 6379
            CidrIp: 0.0.0.0/0
            Description: Redis access
        Tags:
          - Key: Name
            Value: 1bt-lambda-sg-${self:provider.stage}
          - Key: Environment
            Value: ${self:provider.stage}

    # ============================================
    # CLOUDWATCH LOG GROUPS
    # ============================================
    ResourceHandlerLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/1bt-resource-management-${self:provider.stage}-resourceHandler
        RetentionInDays: ${self:custom.environment.LOG_RETENTION_DAYS}

    ProjectHandlerLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/1bt-resource-management-${self:provider.stage}-projectHandler
        RetentionInDays: ${self:custom.environment.LOG_RETENTION_DAYS}

    AuthHandlerLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/1bt-resource-management-${self:provider.stage}-authHandler
        RetentionInDays: ${self:custom.environment.LOG_RETENTION_DAYS}

  # ============================================
  # OUTPUTS
  # ============================================
  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value: !Sub https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiEndpoint

    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-${self:provider.stage}-UserPoolId

    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-${self:provider.stage}-UserPoolClientId

    DocumentsBucketName:
      Description: S3 Bucket for documents
      Value: !Ref DocumentsBucket
      Export:
        Name: ${self:service}-${self:provider.stage}-DocumentsBucket

    SecurityGroupId:
      Description: Lambda Security Group ID
      Value: !Ref LambdaSecurityGroup
      Export:
        Name: ${self:service}-${self:provider.stage}-SecurityGroupId
