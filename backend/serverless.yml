service: onebt-resource-management

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 30
  
  # Environment variables
  environment:
    NODE_ENV: ${self:custom.environment.NODE_ENV}
    LOG_LEVEL: ${self:custom.environment.LOG_LEVEL}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient

  # IAM Role statements
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:GlobalSignOut
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource: !GetAtt CognitoUserPool.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - !Sub ${DocumentsBucket.Arn}/*
        - Effect: Allow
          Action:
            - rds:DescribeDBInstances
            - rds:StartDBInstance
            - rds:StopDBInstance
          Resource: '*'

  # API Gateway settings
  apiGateway:
    shouldStartNameWithService: true
    minimumCompressionSize: 1024

# Custom variables per environment
custom:
  environment: ${file(./infrastructure/parameters/${self:provider.stage}.yml)}
  
  # Serverless plugins config
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

plugins:
  - serverless-offline

# Package configuration
package:
  individually: true
  patterns:
    - '!.git/**'
    - '!.gitignore'
    - '!.env*'
    - '!tests/**'
    - '!docs/**'
    - '!*.md'
    - '!infrastructure/**'
    - '!database/**'
    - '!python_src/**'

# Lambda Functions
functions:
  # ============================================
  # AUTH Handler (No authorizer - public endpoints)
  # ============================================
  authHandler:
    handler: src/handlers/auth/index.handler
    description: Authentication operations (login, logout, refresh)
    events:
      - http:
          path: /api/v1/auth/login
          method: post
          cors: true
      - http:
          path: /api/v1/auth/logout
          method: post
          cors: true
      - http:
          path: /api/v1/auth/refresh
          method: post
          cors: true
      - http:
          path: /api/v1/auth/forgot-password
          method: post
          cors: true
      - http:
          path: /api/v1/auth/reset-password
          method: post
          cors: true
      - http:
          path: /api/v1/auth/invite
          method: post
          cors: true
      - http:
          path: /api/v1/auth/complete-invite
          method: post
          cors: true

  # ============================================
  # RESOURCES Handler (Employees)
  # ============================================
  resourceHandler:
    handler: src/handlers/resources/index.handler
    description: Resource (Employee) CRUD operations
    events:
      - http:
          path: /api/v1/resources
          method: get
          cors: true
      - http:
          path: /api/v1/resources
          method: post
          cors: true
      - http:
          path: /api/v1/resources/{id}
          method: get
          cors: true
      - http:
          path: /api/v1/resources/{id}
          method: put
          cors: true
      - http:
          path: /api/v1/resources/{id}
          method: delete
          cors: true
      - http:
          path: /api/v1/resources/{id}/allocations
          method: get
          cors: true
      - http:
          path: /api/v1/resources/{id}/designation-history
          method: get
          cors: true

  # ============================================
  # PROJECTS Handler
  # ============================================
  projectHandler:
    handler: src/handlers/projects/index.handler
    description: Project CRUD operations
    events:
      - http:
          path: /api/v1/projects
          method: get
          cors: true
      - http:
          path: /api/v1/projects
          method: post
          cors: true
      - http:
          path: /api/v1/projects/{id}
          method: get
          cors: true
      - http:
          path: /api/v1/projects/{id}
          method: put
          cors: true
      - http:
          path: /api/v1/projects/{id}
          method: delete
          cors: true

  # ============================================
  # CLIENTS Handler
  # ============================================
  clientHandler:
    handler: src/handlers/clients/index.handler
    description: Client CRUD operations
    events:
      - http:
          path: /api/v1/clients
          method: get
          cors: true
      - http:
          path: /api/v1/clients
          method: post
          cors: true
      - http:
          path: /api/v1/clients/{id}
          method: get
          cors: true
      - http:
          path: /api/v1/clients/{id}
          method: put
          cors: true
      - http:
          path: /api/v1/clients/{id}
          method: delete
          cors: true

  # ============================================
  # ALLOCATIONS Handler
  # ============================================
  allocationHandler:
    handler: src/handlers/allocations/index.handler
    description: Allocation management
    events:
      - http:
          path: /api/v1/allocations
          method: get
          cors: true
      - http:
          path: /api/v1/allocations
          method: post
          cors: true
      - http:
          path: /api/v1/allocations/{id}
          method: get
          cors: true
      - http:
          path: /api/v1/allocations/{id}
          method: put
          cors: true
      - http:
          path: /api/v1/allocations/{id}
          method: delete
          cors: true

  # ============================================
  # DESIGNATIONS Handler
  # ============================================
  designationHandler:
    handler: src/handlers/designations/index.handler
    description: Designation management
    events:
      - http:
          path: /api/v1/designations
          method: get
          cors: true
      - http:
          path: /api/v1/designations
          method: post
          cors: true
      - http:
          path: /api/v1/designations/{id}
          method: put
          cors: true

  # ============================================
  # TRACKS Handler
  # ============================================
  trackHandler:
    handler: src/handlers/tracks/index.handler
    description: Track management
    events:
      - http:
          path: /api/v1/tracks
          method: get
          cors: true
      - http:
          path: /api/v1/tracks
          method: post
          cors: true
      - http:
          path: /api/v1/tracks/{id}
          method: put
          cors: true

  # ============================================
  # USERS Handler
  # ============================================
  userHandler:
    handler: src/handlers/users/index.handler
    description: User management
    events:
      - http:
          path: /api/v1/users
          method: get
          cors: true
      - http:
          path: /api/v1/users
          method: post
          cors: true
      - http:
          path: /api/v1/users/{id}
          method: get
          cors: true
      - http:
          path: /api/v1/users/{id}
          method: put
          cors: true

  # ============================================
  # REPORTS Handler
  # ============================================
  reportHandler:
    handler: src/handlers/reports/index.handler
    description: Dashboard and reports
    events:
      - http:
          path: /api/v1/reports/dashboard
          method: get
          cors: true
      - http:
          path: /api/v1/reports/utilization
          method: get
          cors: true
      - http:
          path: /api/v1/reports/billing
          method: get
          cors: true

  # ============================================
  # DATABASE MIGRATION Handler (VPC-enabled)
  # ============================================
  migrationHandler:
    handler: src/handlers/migrations/index.handler
    description: Database migration function (runs in VPC)
    timeout: 300
    memorySize: 1024
    vpc:
      securityGroupIds:
        - Fn::ImportValue: !Sub onebt-rm-${self:provider.stage}-LambdaSecurityGroupId
      subnetIds:
        - Fn::ImportValue: !Sub onebt-rm-${self:provider.stage}-PrivateSubnet1Id
        - Fn::ImportValue: !Sub onebt-rm-${self:provider.stage}-PrivateSubnet2Id
    environment:
      DATABASE_HOST:
        Fn::ImportValue: !Sub onebt-rm-${self:provider.stage}-RDSEndpoint
      DATABASE_PORT: '5432'
      DATABASE_NAME: resource_management_${self:provider.stage}
      DATABASE_USER: dbadmin
      DATABASE_PASSWORD: ${ssm:/1bt/${self:provider.stage}/db-password}
    package:
      patterns:
        - src/handlers/migrations/**

# CloudFormation Resources
resources:
  Resources:
    # ============================================
    # COGNITO USER POOL
    # ============================================
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: onebt-resource-users-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        UsernameConfiguration:
          CaseSensitive: false
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            TemporaryPasswordValidityDays: 7
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: false
        UserPoolTags:
          Environment: ${self:provider.stage}
          Project: 1BT-Resource-Management

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: onebt-web-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # ============================================
    # S3 BUCKET - Documents
    # ============================================
    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: onebt-documents-${self:provider.stage}-${aws:accountId}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}

  # ============================================
  # OUTPUTS
  # ============================================
  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value: !Sub https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}
      Export:
        Name: ${self:service}-${self:provider.stage}-ApiEndpoint

    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-${self:provider.stage}-UserPoolId

    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-${self:provider.stage}-UserPoolClientId

    DocumentsBucketName:
      Description: S3 Bucket for documents
      Value: !Ref DocumentsBucket
      Export:
        Name: ${self:service}-${self:provider.stage}-DocumentsBucket
