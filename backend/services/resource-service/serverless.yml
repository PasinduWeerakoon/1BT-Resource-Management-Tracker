service: onebt-resource-service

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 256
  timeout: 30
  tags:
    Service: resource
    Project: 1BT-Resource-Management

  # Keep CloudFormation template smaller (avoids 51KB inline / change-set issues on large services).
  versionFunctions: false
  deploymentBucket:
    name: serverless-framework-deployments-ap-southeast-1-c03bcf0e-ef8a

  # VPC Configuration - default VPC (see /onebt/<stage>/lambda-*).
  # Moved off the onebt-infrastructure VPC exports so the app runs
  # alongside the RDS instance in the default VPC.
  vpc:
    securityGroupIds:
      - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
    subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}

  environment:
    NODE_ENV: ${self:provider.stage}
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: ${ssm:/onebt/${self:provider.stage}/db-port}
    DB_NAME: ${ssm:/onebt/${self:provider.stage}/db-name}
    DB_SECRET_ARN: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:onebt-report-service-${self:provider.stage}-calculateDailyStats"

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

  layers:
    - ${self:custom.sharedLibsLayerArn}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"

custom:
  sharedLibsLayerArn: ${ssm:/onebt/shared/layer-arn/${self:provider.stage}}
  authorizer:
    type: jwt
    id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

functions:
  # ==================== RESOURCES ====================
  listResources:
    handler: src/handlers/resources.list
    description: List all resources with pagination and filters
    events:
      - httpApi:
          path: /api/v1/resources
          method: GET
          authorizer: ${self:custom.authorizer}

  getResource:
    handler: src/handlers/resources.getById
    description: Get a single resource by ID
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  createResource:
    handler: src/handlers/resources.create
    description: Create a new resource
    events:
      - httpApi:
          path: /api/v1/resources
          method: POST
          authorizer: ${self:custom.authorizer}

  updateResource:
    handler: src/handlers/resources.update
    description: Update an existing resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: PUT
          authorizer: ${self:custom.authorizer}

  deleteResource:
    handler: src/handlers/resources.remove
    description: Soft delete a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: DELETE
          authorizer: ${self:custom.authorizer}

  getResourceAllocations:
    handler: src/handlers/resources.getAllocations
    description: Get allocations for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/allocations
          method: GET
          authorizer: ${self:custom.authorizer}

  getDesignationHistory:
    handler: src/handlers/resources.getDesignationHistory
    description: Get designation history for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/designation-history
          method: GET
          authorizer: ${self:custom.authorizer}

  toggleAccountManager:
    handler: src/handlers/resources.toggleAccountManager
    description: Toggle account manager status for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/account-manager
          method: PUT
          authorizer: ${self:custom.authorizer}

  updateResourceTier:
    handler: src/handlers/resources.updateTier
    description: Update resource tier
    events:
      - httpApi:
          path: /api/v1/resources/{id}/tier
          method: PUT
          authorizer: ${self:custom.authorizer}

  updateResourceTechStack:
    handler: src/handlers/resources.updateTechStack
    description: Update resource tech stack
    events:
      - httpApi:
          path: /api/v1/resources/{id}/tech-stack
          method: PUT
          authorizer: ${self:custom.authorizer}
