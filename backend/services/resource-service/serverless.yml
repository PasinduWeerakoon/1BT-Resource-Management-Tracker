service: onebt-resource-service

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 256
  timeout: 30
  tags:
    Service: resource
    Project: 1BT-Resource-Management

  # VPC Configuration - Required for RDS access
  vpc:
    securityGroupIds:
      - !ImportValue onebt-${self:provider.stage}-LambdaSecurityGroupId
    subnetIds: !Split
      - ","
      - !ImportValue onebt-${self:provider.stage}-PrivateSubnetIds

  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: !ImportValue onebt-${self:provider.stage}-RdsEndpoint
    DB_PORT: !ImportValue onebt-${self:provider.stage}-RdsPort
    DB_NAME: !ImportValue onebt-${self:provider.stage}-DbName
    DB_SECRET_ARN: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

  layers:
    - arn:aws:lambda:${self:provider.region}:550586832874:layer:onebt-shared-libs-${self:provider.stage}:24

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"

custom:
  authorizer:
    type: jwt
    id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

functions:
  # ==================== RESOURCES ====================
  listResources:
    handler: src/handlers/resources.list
    description: List all resources with pagination and filters
    events:
      - httpApi:
          path: /api/v1/resources
          method: GET
          authorizer: ${self:custom.authorizer}

  getResource:
    handler: src/handlers/resources.getById
    description: Get a single resource by ID
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  createResource:
    handler: src/handlers/resources.create
    description: Create a new resource
    events:
      - httpApi:
          path: /api/v1/resources
          method: POST
          authorizer: ${self:custom.authorizer}

  updateResource:
    handler: src/handlers/resources.update
    description: Update an existing resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: PUT
          authorizer: ${self:custom.authorizer}

  deleteResource:
    handler: src/handlers/resources.remove
    description: Soft delete a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}
          method: DELETE
          authorizer: ${self:custom.authorizer}

  getResourceAllocations:
    handler: src/handlers/resources.getAllocations
    description: Get allocations for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/allocations
          method: GET
          authorizer: ${self:custom.authorizer}

  getDesignationHistory:
    handler: src/handlers/resources.getDesignationHistory
    description: Get designation history for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/designation-history
          method: GET
          authorizer: ${self:custom.authorizer}

  toggleAccountManager:
    handler: src/handlers/resources.toggleAccountManager
    description: Toggle account manager status for a resource
    events:
      - httpApi:
          path: /api/v1/resources/{id}/account-manager
          method: PUT
          authorizer: ${self:custom.authorizer}

  updateResourceTier:
    handler: src/handlers/resources.updateTier
    description: Update resource tier
    events:
      - httpApi:
          path: /api/v1/resources/{id}/tier
          method: PUT
          authorizer: ${self:custom.authorizer}

  updateResourceTechStack:
    handler: src/handlers/resources.updateTechStack
    description: Update resource tech stack
    events:
      - httpApi:
          path: /api/v1/resources/{id}/tech-stack
          method: PUT
          authorizer: ${self:custom.authorizer}

  # ==================== DESIGNATIONS ====================
  listDesignations:
    handler: src/handlers/designations.list
    description: List all designations
    events:
      - httpApi:
          path: /api/v1/designations
          method: GET
          authorizer: ${self:custom.authorizer}

  getDesignation:
    handler: src/handlers/designations.getById
    description: Get a designation by ID
    events:
      - httpApi:
          path: /api/v1/designations/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  createDesignation:
    handler: src/handlers/designations.create
    description: Create a new designation
    events:
      - httpApi:
          path: /api/v1/designations
          method: POST
          authorizer: ${self:custom.authorizer}

  updateDesignation:
    handler: src/handlers/designations.update
    description: Update an existing designation
    events:
      - httpApi:
          path: /api/v1/designations/{id}
          method: PUT
          authorizer: ${self:custom.authorizer}

  # ==================== TRACKS ====================
  listTracks:
    handler: src/handlers/tracks.list
    description: List all tracks
    events:
      - httpApi:
          path: /api/v1/tracks
          method: GET
          authorizer: ${self:custom.authorizer}

  getTrack:
    handler: src/handlers/tracks.getById
    description: Get a track by ID
    events:
      - httpApi:
          path: /api/v1/tracks/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  createTrack:
    handler: src/handlers/tracks.create
    description: Create a new track
    events:
      - httpApi:
          path: /api/v1/tracks
          method: POST
          authorizer: ${self:custom.authorizer}

  updateTrack:
    handler: src/handlers/tracks.update
    description: Update an existing track
    events:
      - httpApi:
          path: /api/v1/tracks/{id}
          method: PUT
          authorizer: ${self:custom.authorizer}
