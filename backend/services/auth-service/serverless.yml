service: onebt-auth-service

custom:
  # Resolved at deploy time from SSM (written by onebt-shared-<stage> stack).
  # Avoids CFN ImportValue, which blocks shared layer updates while consumers exist.
  sharedLibsLayerArn: ${ssm:/onebt/shared/layer-arn/${self:provider.stage}}

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  # Keep CF template under 51KB (many functions + version resources exceed API inline limit).
  versionFunctions: false
  memorySize: 256
  timeout: 30
  tags:
    Service: auth
    Project: 1BT-Resource-Management

  # Use existing regional bucket so the stack does not embed ServerlessDeploymentBucket in the template.
  deploymentBucket:
    name: serverless-framework-deployments-ap-southeast-1-c03bcf0e-ef8a

  environment:
    NODE_ENV: ${self:provider.stage}
    COGNITO_USER_POOL_ID: !ImportValue onebt-${self:provider.stage}-CognitoUserPoolId
    COGNITO_CLIENT_ID: !ImportValue onebt-${self:provider.stage}-CognitoClientId
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: ${ssm:/onebt/${self:provider.stage}/db-port}
    DB_NAME: ${ssm:/onebt/${self:provider.stage}/db-name}
    DB_SECRET_ARN: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:GlobalSignOut
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
            - cognito-idp:ListUsers
            - cognito-idp:AdminListGroupsForUser
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
          Resource: !ImportValue onebt-${self:provider.stage}-CognitoUserPoolArn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}

  # VPC config is set per-function for functions that need database access
  # Functions without database access should NOT be in VPC to allow direct Cognito access

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

  layers:
    - ${self:custom.sharedLibsLayerArn}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "package.json"
    - "node_modules/drizzle-orm/**"
    - "src/**"

functions:
  # ============================================
  # LOGIN - Public endpoint
  # ============================================
  login:
    handler: src/handlers/auth.login
    description: User login
    events:
      - httpApi:
          path: /api/v1/auth/login
          method: POST

  # ============================================
  # LOGOUT - Public endpoint
  # ============================================
  logout:
    handler: src/handlers/auth.logout
    description: User logout
    events:
      - httpApi:
          path: /api/v1/auth/logout
          method: POST

  # ============================================
  # REFRESH TOKEN - Public endpoint
  # ============================================
  refresh:
    handler: src/handlers/auth.refresh
    description: Refresh access token
    events:
      - httpApi:
          path: /api/v1/auth/refresh
          method: POST

  # ============================================
  # FORGOT PASSWORD - Public endpoint
  # ============================================
  forgotPassword:
    handler: src/handlers/auth.forgotPassword
    description: Initiate password reset
    events:
      - httpApi:
          path: /api/v1/auth/forgot-password
          method: POST

  # ============================================
  # RESET PASSWORD - Public endpoint
  # ============================================
  resetPassword:
    handler: src/handlers/auth.resetPassword
    description: Complete password reset
    events:
      - httpApi:
          path: /api/v1/auth/reset-password
          method: POST

  # ============================================
  # INVITE USER - Protected endpoint (Admin only)
  # Step 1: Creates Cognito user only (no VPC needed)
  # ============================================
  inviteUser:
    handler: src/handlers/auth.inviteUser
    description: Create Cognito user for employee invitation (Admin only)
    events:
      - httpApi:
          path: /api/v1/auth/invite
          method: POST
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # LINK USER TO EMPLOYEE - Protected endpoint (Admin only)
  # Step 2: Creates DB record (requires VPC)
  # ============================================
  linkUserToEmployee:
    handler: src/handlers/auth.linkUserToEmployee
    description: Create database user record linked to employee (Admin only)
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/link-user
          method: POST
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # COMPLETE INVITE - Public endpoint
  # Sets password for invited user (no VPC needed)
  # ============================================
  completeInvite:
    handler: src/handlers/auth.completeInvite
    description: Complete user invitation - set password
    events:
      - httpApi:
          path: /api/v1/auth/complete-invite
          method: POST

  # ============================================
  # ACTIVATE USER - Public endpoint (requires VPC)
  # Updates user status after password is set
  # ============================================
  activateUser:
    handler: src/handlers/auth.activateUser
    description: Activate user after password set
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/activate-user
          method: POST

  # ============================================
  # GET CURRENT USER - Protected endpoint
  # ============================================
  getCurrentUser:
    handler: src/handlers/auth.getCurrentUser
    description: Get current authenticated user info
    events:
      - httpApi:
          path: /api/v1/auth/me
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # GET SYSTEM USERS - Protected endpoint (Admin only)
  # ============================================
  getSystemUsers:
    handler: src/handlers/auth.getSystemUsers
    description: Get all system users from Cognito (Admin only)
    events:
      - httpApi:
          path: /api/v1/auth/cognito-users
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # GET DB USERS - Protected endpoint (Admin only, requires VPC)
  # ============================================
  getDbUsers:
    handler: src/handlers/auth.getDbUsers
    description: Get all users from database with employee info (Admin only)
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/users
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # GET INVITABLE EMPLOYEES - Protected endpoint (Admin only, requires VPC)
  # ============================================
  getInvitableEmployees:
    handler: src/handlers/auth.getInvitableEmployees
    description: Get employees eligible for user invitation (Admin only)
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/invitable-employees
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # UPDATE USER ROLE - Protected endpoint (Admin only, NO VPC - calls Cognito)
  # ============================================
  updateUserRole:
    handler: src/handlers/auth.updateUserRole
    description: Update user role in Cognito groups (Admin only, non-VPC)
    events:
      - httpApi:
          path: /api/v1/auth/update-role
          method: PUT
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # UPDATE USER ROLE DB - Internal endpoint (Admin only, VPC)
  # ============================================
  updateUserRoleDb:
    handler: src/handlers/auth.updateUserRoleDb
    description: Update user role in database (Admin only, VPC)
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/update-role-db
          method: POST
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # REVOKE USER ACCESS - Protected endpoint (Admin only, NO VPC - calls Cognito)
  # ============================================
  revokeUserAccess:
    handler: src/handlers/auth.revokeUserAccess
    description: Revoke user access - disable in Cognito (Admin only, non-VPC)
    events:
      - httpApi:
          path: /api/v1/auth/revoke-access
          method: POST
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

  # ============================================
  # REVOKE USER ACCESS DB - Internal endpoint (Admin only, VPC)
  # ============================================
  revokeUserAccessDb:
    handler: src/handlers/auth.revokeUserAccessDb
    description: Revoke user access - update status in database (Admin only, VPC)
    vpc:
      securityGroupIds:
        - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
      subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}
    events:
      - httpApi:
          path: /api/v1/auth/revoke-access-db
          method: POST
          authorizer:
            type: jwt
            id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

