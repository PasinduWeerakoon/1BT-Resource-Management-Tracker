service: onebt-allocation-service

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 256
  timeout: 30
  tags:
    Service: allocation
    Project: 1BT-Resource-Management

  # VPC Configuration - default VPC (see /onebt/<stage>/lambda-*).
  # Moved off the onebt-infrastructure VPC exports so the app runs
  # alongside the RDS instance in the default VPC.
  vpc:
    securityGroupIds:
      - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
    subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}

  environment:
    NODE_ENV: ${self:provider.stage}
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: ${ssm:/onebt/${self:provider.stage}/db-port}
    DB_NAME: ${ssm:/onebt/${self:provider.stage}/db-name}
    DB_SECRET_ARN: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:onebt-report-service-${self:provider.stage}-calculateDailyStats"

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

  # Layer ARN via CloudFormation export from onebt-shared-<stage> (avoids stale version numbers).
  layers:
    - ${self:custom.sharedLibsLayerArn}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"
    - "package.json"

custom:
  sharedLibsLayerArn: ${ssm:/onebt/shared/layer-arn/${self:provider.stage}}
  authorizer:
    type: jwt
    id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

functions:
  # ==================== ALLOCATIONS ====================
  listAllocations:
    handler: src/handlers/allocations/index.list
    description: List all allocations with filters
    events:
      - httpApi:
          path: /api/v1/allocations
          method: GET
          authorizer: ${self:custom.authorizer}

  getAllocation:
    handler: src/handlers/allocations/index.getById
    description: Get an allocation by ID
    events:
      - httpApi:
          path: /api/v1/allocations/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  createAllocation:
    handler: src/handlers/allocations/index.create
    description: Create a new allocation
    events:
      - httpApi:
          path: /api/v1/allocations
          method: POST
          authorizer: ${self:custom.authorizer}

  updateAllocation:
    handler: src/handlers/allocations/index.update
    description: Update an existing allocation
    events:
      - httpApi:
          path: /api/v1/allocations/{id}
          method: PUT
          authorizer: ${self:custom.authorizer}

  deleteAllocation:
    handler: src/handlers/allocations/index.remove
    description: Remove an allocation
    events:
      - httpApi:
          path: /api/v1/allocations/{id}
          method: DELETE
          authorizer: ${self:custom.authorizer}

  getMonthlyAllocations:
    handler: src/handlers/allocations/index.getMonthly
    description: Get monthly allocation view
    events:
      - httpApi:
          path: /api/v1/allocations/monthly
          method: GET
          authorizer: ${self:custom.authorizer}

  getAllocationHistory:
    handler: src/handlers/allocations/index.getHistory
    description: Get allocation history for a resource
    events:
      - httpApi:
          path: /api/v1/allocations/history/{resourceId}
          method: GET
          authorizer: ${self:custom.authorizer}

  # ==================== FUTURE ALLOCATIONS ====================
  listFutureAllocations:
    handler: src/handlers/futureAllocations.list
    description: List all future allocations
    events:
      - httpApi:
          path: /api/v1/future-allocations
          method: GET
          authorizer: ${self:custom.authorizer}

  createFutureAllocation:
    handler: src/handlers/futureAllocations.create
    description: Create a new future allocation
    events:
      - httpApi:
          path: /api/v1/future-allocations
          method: POST
          authorizer: ${self:custom.authorizer}

  getFutureAllocation:
    handler: src/handlers/futureAllocations.getById
    description: Get a future allocation by ID
    events:
      - httpApi:
          path: /api/v1/future-allocations/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  getFutureAllocationsByResource:
    handler: src/handlers/futureAllocations.getByResource
    description: Get future allocations for a resource
    events:
      - httpApi:
          path: /api/v1/future-allocations/resource/{resourceId}
          method: GET
          authorizer: ${self:custom.authorizer}

  cancelFutureAllocation:
    handler: src/handlers/futureAllocations.cancel
    description: Cancel a future allocation
    events:
      - httpApi:
          path: /api/v1/future-allocations/{id}
          method: DELETE
          authorizer: ${self:custom.authorizer}

  getPendingFutureAllocations:
    handler: src/handlers/futureAllocations.getPending
    description: Get future allocations pending activation
    events:
      - httpApi:
          path: /api/v1/future-allocations/pending
          method: GET
          authorizer: ${self:custom.authorizer}

  getFutureAllocationStats:
    handler: src/handlers/futureAllocations.getStats
    description: Get future allocation statistics
    events:
      - httpApi:
          path: /api/v1/future-allocations/stats
          method: GET
          authorizer: ${self:custom.authorizer}

  # ==================== SCHEDULED JOBS ====================
  gapDetectionJob:
    handler: src/handlers/allocations/index.gapDetectionJob
    description: Nightly job to detect and fill allocation gaps with Bench
    timeout: 300
    events:
      # Hourly 03:00-16:00 UTC = 08:30-21:30 Colombo, weekdays only - the hours
      # the database is running. A 24/7 hourly rate would fail 10 times a night
      # and all weekend.
      - schedule:
          rate: cron(0 3-16 ? * MON-FRI *)
          description: Enhancement 3.4 - Gap Detection & Auto-Bench Fill
          enabled: true

  billingStatusTransitionJob:
    handler: src/handlers/allocations/index.billingStatusTransitionJob
    description: Daily job to auto-transition billing status based on project type
    timeout: 300
    events:
      # 03:00 UTC = 08:30 Colombo, weekdays only - 30 minutes after the database
      # starts, and never at the weekend while it is stopped.
      - schedule:
          rate: cron(0 3 ? * MON-FRI *)
          description: Enhancement 3.10 - Auto-Transition Billing Status
          enabled: true
  utilizationSnapshotJob:
    handler: src/handlers/allocations/index.utilizationSnapshotJob
    description: Daily job to capture historical utilization snapshots
    timeout: 300
    events:
      # 05:30 UTC = 11:00 Colombo, weekdays only. Moved off midnight UTC, which
      # now falls inside the nightly shutdown, and staggered after the stats job.
      - schedule:
          rate: cron(30 5 ? * MON-FRI *)
          description: Enhancement 3.12 - Historical Utilization Snapshots
          enabled: true
