service: onebt-document-service

provider:
  name: aws
  runtime: python3.12
  # Must match pip wheels: SAM image below builds for this arch (use arm64 + :latest-arm64 if on Graviton).
  architecture: x86_64
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  # Named profile from ~/.aws/credentials. Override per deploy with: --aws-profile <name> (not --profile).
  # Or: AWS_PROFILE=<name> npx serverless deploy ...
  profile: ${env:AWS_PROFILE, 'default'}
  memorySize: 512 # Document generation needs more memory
  timeout: 60 # PDFs can take time to generate
  tags:
    Service: document
    Project: 1BT-Resource-Management

  # VPC Configuration - Required for RDS access
  vpc:
    securityGroupIds:
      - !ImportValue onebt-${self:provider.stage}-LambdaSecurityGroupId
    subnetIds: !Split
      - ","
      - !ImportValue onebt-${self:provider.stage}-PrivateSubnetIds

  environment:
    STAGE: ${self:provider.stage}
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: !ImportValue onebt-${self:provider.stage}-RdsPort
    DB_NAME: !ImportValue onebt-${self:provider.stage}-DbName
    DB_SECRET_ARN: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
    S3_BUCKET: !Ref DocumentsBucket
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub arn:aws:s3:::${DocumentsBucket}/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

plugins:
  - serverless-python-requirements
  - serverless-offline

custom:
  pythonRequirements:
    # --- Local deploy from Mac or Windows ---
    # psycopg2-binary includes native code; it MUST be installed inside Linux matching Lambda.
    # serverless-python-requirements runs pip inside Docker using the SAM image below.
    #
    # Prerequisites (every machine that runs `serverless deploy`):
    #   - Docker Desktop (or Docker Engine) running before deploy.
    #   - First pull may need: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    #   - Windows: use Docker Desktop + WSL2 backend if bind-mount / pip in Docker fails; avoid very long paths under the repo.
    #   - Mac (Apple Silicon): Docker runs the x86_64 image via emulation — slower but produces correct Lambda x86_64 wheels.
    #
    # Do not set dockerizePip: false on Mac/Windows — you will get Runtime.ImportModuleError for psycopg2._psycopg on Lambda.
    dockerizePip: true
    dockerImage: public.ecr.aws/sam/build-python3.12:latest-x86_64
    slim: false
    strip: false
    noDeploy:
      - pytest
      - boto3 # Already in Lambda runtime

  authorizer:
    type: jwt
    id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "!requirements-dev.txt"
    - "src/**"

functions:
  # ==================== DOCUMENT GENERATION ====================
  generatePdf:
    handler: src/handlers/documents.generate_pdf
    description: Generate PDF report
    events:
      - httpApi:
          path: /api/v1/documents/pdf
          method: POST
          authorizer: ${self:custom.authorizer}

  generateExcel:
    handler: src/handlers/documents.generate_excel
    description: Generate Excel report
    events:
      - httpApi:
          path: /api/v1/documents/excel
          method: POST
          authorizer: ${self:custom.authorizer}

  generateSummaryExcel:
    handler: src/handlers/documents.generate_summary_excel
    description: Generate summary report Excel
    events:
      - httpApi:
          path: /api/v1/documents/excel/summary
          method: GET
          authorizer: ${self:custom.authorizer}

  generateNonBillingExcel:
    handler: src/handlers/documents.generate_non_billing_excel
    description: Generate non-billing (critical shadows) report Excel
    events:
      - httpApi:
          path: /api/v1/documents/excel/non-billing
          method: GET
          authorizer: ${self:custom.authorizer}

  generateProjectsExcel:
    handler: src/handlers/documents.generate_projects_excel
    description: Generate projects report Excel
    events:
      - httpApi:
          path: /api/v1/documents/excel/projects
          method: GET
          authorizer: ${self:custom.authorizer}

  generateAllEmployeesExcel:
    handler: src/handlers/documents.generate_all_employees_excel
    description: Generate all employees roster Excel
    events:
      - httpApi:
          path: /api/v1/documents/excel/all-employees
          method: GET
          authorizer: ${self:custom.authorizer}

  generateMonthlyAllocationExcel:
    handler: src/handlers/documents.generate_monthly_allocation_excel
    description: Generate monthly allocation report Excel
    events:
      - httpApi:
          path: /api/v1/documents/excel/monthly-allocation
          method: GET
          authorizer: ${self:custom.authorizer}

  getDocument:
    handler: src/handlers/documents.get_document
    description: Get a generated document
    events:
      - httpApi:
          path: /api/v1/documents/{id}
          method: GET
          authorizer: ${self:custom.authorizer}

  listDocuments:
    handler: src/handlers/documents.list_documents
    description: List generated documents
    events:
      - httpApi:
          path: /api/v1/documents
          method: GET
          authorizer: ${self:custom.authorizer}

  deleteDocument:
    handler: src/handlers/documents.delete_document
    description: Delete a generated document
    events:
      - httpApi:
          path: /api/v1/documents/{id}
          method: DELETE
          authorizer: ${self:custom.authorizer}

resources:
  Resources:
    # S3 Bucket for generated documents
    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: onebt-documents-${self:provider.stage}-${aws:accountId}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldDocuments
              Status: Enabled
              ExpirationInDays: 30 # Auto-delete documents after 30 days
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Project
            Value: 1BT-Resource-Management

  Outputs:
    DocumentsBucketName:
      Description: Documents S3 bucket name
      Value: !Ref DocumentsBucket
      Export:
        Name: onebt-${self:provider.stage}-DocumentsBucket
