service: onebt-report-service

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  # Publishing a Lambda version per function balloons the CF template past the 51KB limit for large stacks.
  versionFunctions: false
  memorySize: 512 # Reports need more memory for data processing
  timeout: 60 # Reports can take longer
  tags:
    Service: report
    Project: 1BT-Resource-Management

  # Use existing regional deployments bucket so CF template omits ServerlessDeploymentBucket resources (keeps template under 51KB inline limit edge cases).
  deploymentBucket:
    name: serverless-framework-deployments-ap-southeast-1-c03bcf0e-ef8a

  # VPC Configuration - default VPC (see /onebt/<stage>/lambda-*).
  # Moved off the onebt-infrastructure VPC exports so the app runs
  # alongside the RDS instance in the default VPC.
  vpc:
    securityGroupIds:
      - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
    subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}

  environment:
    NODE_ENV: ${self:provider.stage}
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: ${ssm:/onebt/${self:provider.stage}/db-port}
    DB_NAME: ${ssm:/onebt/${self:provider.stage}/db-name}
    DB_SECRET_ARN: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn

  httpApi:
    id: !ImportValue onebt-${self:provider.stage}-HttpApiId

  # Layer ARN from onebt-shared-<stage> stack export (avoids stale :version ARNs per stage).
  layers:
    - ${self:custom.sharedLibsLayerArn}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"
    - "package.json"

custom:
  sharedLibsLayerArn: ${ssm:/onebt/shared/layer-arn/${self:provider.stage}}
  authorizer:
    type: jwt
    id: !ImportValue onebt-${self:provider.stage}-CognitoAuthorizerId

functions:
  # ==================== DASHBOARD STATS ====================
  dashboardResourceCounts:
    handler: src/handlers/reports/index.getDashboardResourceCounts
    description: Get dashboard resource counts (billing, allocated, bench, etc.)
    events:
      - httpApi:
          path: /api/v1/dashboard/resource-counts
          method: GET
          authorizer: ${self:custom.authorizer}

  dashboardPercentages:
    handler: src/handlers/reports/index.getDashboardPercentages
    description: Get dashboard percentages (allocation, billable, shadow)
    events:
      - httpApi:
          path: /api/v1/dashboard/percentages
          method: GET
          authorizer: ${self:custom.authorizer}

  dashboardCharts:
    handler: src/handlers/reports/index.getDashboardCharts
    description: Get dashboard charts data (accounts by track and tech stack)
    events:
      - httpApi:
          path: /api/v1/dashboard/charts
          method: GET
          authorizer: ${self:custom.authorizer}

  # ==================== REPORTS ====================
  benchReport:
    handler: src/handlers/reports/index.getBenchReport
    description: Get bench resources report
    events:
      - httpApi:
          path: /api/v1/reports/bench
          method: GET
          authorizer: ${self:custom.authorizer}

  accountManagerReport:
    handler: src/handlers/reports/index.getAccountManagerReport
    description: Get account manager report with filters, charts, and tables
    events:
      - httpApi:
          path: /api/v1/reports/account-manager
          method: GET
          authorizer: ${self:custom.authorizer}

  listAccountManagers:
    handler: src/handlers/reports/index.getAccountManagers
    description: Get list of all account managers
    events:
      - httpApi:
          path: /api/v1/account-managers
          method: GET
          authorizer: ${self:custom.authorizer}

  employeeReport:
    handler: src/handlers/reports/index.getEmployeeReport
    description: Get employee allocation report
    events:
      - httpApi:
          path: /api/v1/reports/employee
          method: GET
          authorizer: ${self:custom.authorizer}

  internReport:
    handler: src/handlers/reports/index.getInternReport
    description: Get intern report with projects and statistics
    events:
      - httpApi:
          path: /api/v1/reports/intern
          method: GET
          authorizer: ${self:custom.authorizer}

  monthlyAllocationReport:
    handler: src/handlers/reports/index.getMonthlyAllocationReport
    description: Get monthly allocation report
    events:
      - httpApi:
          path: /api/v1/reports/monthly-allocation
          method: GET
          authorizer: ${self:custom.authorizer}

  clientCostSnapshot:
    handler: src/handlers/reports/index.getClientCostSnapshot
    description: Get client cost snapshot by employee allocations
    events:
      - httpApi:
          path: /api/v1/reports/client-cost-snapshot
          method: GET
          authorizer: ${self:custom.authorizer}

  exceptionReport:
    handler: src/handlers/reports/index.getExceptionReport
    description: Get exception allocation report
    events:
      - httpApi:
          path: /api/v1/reports/exception
          method: GET
          authorizer: ${self:custom.authorizer}

  nonBillingReport:
    handler: src/handlers/reports/index.getNonBillingReport
    description: Get non-billing resources report
    events:
      - httpApi:
          path: /api/v1/reports/non-billing
          method: GET
          authorizer: ${self:custom.authorizer}

  preSaleReport:
    handler: src/handlers/reports/index.getPreSaleReport
    description: Get pre-sale activities report
    events:
      - httpApi:
          path: /api/v1/reports/pre-sale
          method: GET
          authorizer: ${self:custom.authorizer}

  tierBreakdownReport:
    handler: src/handlers/reports/index.getTierBreakdownReport
    description: Get tier breakdown report with employee details
    events:
      - httpApi:
          path: /api/v1/reports/tier-breakdown
          method: GET
          authorizer: ${self:custom.authorizer}

  trainingReport:
    handler: src/handlers/reports/index.getTrainingReport
    description: Get training report with charts and tables
    events:
      - httpApi:
          path: /api/v1/reports/training
          method: GET
          authorizer: ${self:custom.authorizer}

  externalConsultantsReport:
    handler: src/handlers/reports/index.getExternalConsultantsReport
    description: Get external consultants report with allocation details
    events:
      - httpApi:
          path: /api/v1/reports/external-consultants
          method: GET
          authorizer: ${self:custom.authorizer}

  # ==================== SCHEDULED JOBS ====================
  calculateDailyStats:
    handler: src/handlers/scheduledJobs.calculateDailyStats
    description: Calculate and cache daily dashboard statistics
    timeout: 120 # Allow more time for complex calculations
    memorySize: 1024 # More memory for aggregations
    events:
      # 05:00 UTC = 10:30 Colombo, weekdays only. The database runs 08:00-22:00
      # Colombo Mon-Fri and is stopped all weekend, so midnight UTC and any
      # Sat/Sun run would hit a stopped instance. These UTC hours map to the same
      # weekday in Colombo (+05:30), so MON-FRI means the same in both.
      - schedule:
          rate: cron(0 5 ? * MON-FRI *)
          enabled: true
          description: Daily dashboard stats calculation (10:30 Colombo, weekdays)
      # Also expose as HTTP endpoint for manual triggers
      - httpApi:
          path: /api/v1/dashboard/calculate-stats
          method: POST
          authorizer: ${self:custom.authorizer}

  cleanupOldStats:
    handler: src/handlers/scheduledJobs.cleanupOldStats
    description: Cleanup dashboard stats older than 365 days
    timeout: 60
    events:
      # Moved off Sunday entirely - the database is stopped at weekends now.
      # Monday 06:00 UTC = 11:30 Colombo, after the week's first start.
      - schedule:
          rate: cron(0 6 ? * MON *)
          enabled: true
          description: Weekly cleanup of old dashboard stats (Mon 11:30 Colombo)
