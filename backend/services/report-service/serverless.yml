service: onebt-report-service

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-southeast-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512 # Reports may need more memory for complex queries
  timeout: 60 # Reports may take longer

  # VPC Configuration - Required for RDS access
  vpc:
    securityGroupIds:
      - !ImportValue onebt-rm-${self:provider.stage}-LambdaSecurityGroupId
    subnetIds: !Split
      - ","
      - !ImportValue onebt-rm-${self:provider.stage}-PrivateSubnetIds

  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    # Database - from RDS stack
    DB_HOST: !ImportValue onebt-rm-${self:provider.stage}-RDSEndpoint
    DB_PORT: "5432"
    DB_NAME: onebt_rm_${self:provider.stage}
    DB_USER: ${ssm:/onebt-rm/${self:provider.stage}/db/username}
    DB_PASSWORD: ${ssm:/onebt-rm/${self:provider.stage}/db/password}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/onebt-rm/${self:provider.stage}/*

custom:
  logLevel:
    dev: debug
    qa: info
    uat: info
    prod: warn

  sharedLayerVersion: ${env:SHARED_LAYER_VERSION, '1'}

layers:
  - arn:aws:lambda:${self:provider.region}:${aws:accountId}:layer:onebt-shared-layer:${self:custom.sharedLayerVersion}

package:
  individually: true
  patterns:
    - "!**/*"
    - "src/**"

functions:
  # ==================== DASHBOARD ====================
  getDashboard:
    handler: src/handlers/reports.getDashboard
    description: Get dashboard summary data
    events:
      - httpApi:
          path: /dashboard
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  # ==================== REPORTS ====================
  getAllocationReport:
    handler: src/handlers/reports.getAllocationReport
    description: Get allocation report with filters
    events:
      - httpApi:
          path: /reports/allocations
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  getBenchReport:
    handler: src/handlers/reports.getBenchReport
    description: Get bench report - resources with available capacity
    events:
      - httpApi:
          path: /reports/bench
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  getUtilizationReport:
    handler: src/handlers/reports.getUtilizationReport
    description: Get utilization report by track
    events:
      - httpApi:
          path: /reports/utilization
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  getInternReport:
    handler: src/handlers/reports.getInternReport
    description: Get intern report
    events:
      - httpApi:
          path: /reports/interns
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  getAccountManagerReport:
    handler: src/handlers/reports.getAccountManagerReport
    description: Get account manager report
    events:
      - httpApi:
          path: /reports/account-managers
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId

  getMonthlyAllocationReport:
    handler: src/handlers/reports.getMonthlyAllocationReport
    description: Get monthly allocation report
    events:
      - httpApi:
          path: /reports/monthly-allocations
          method: GET
          authorizer:
            type: jwt
            id: !ImportValue onebt-rm-${self:provider.stage}-CognitoAuthorizerId
