service: onebt-migration-service

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 300 # 5 minutes for migrations
  tags:
    Service: migration
    Project: 1BT-Resource-Management

  # VPC Configuration - Required for RDS access
  vpc:
    securityGroupIds:
      - !ImportValue onebt-${self:provider.stage}-LambdaSecurityGroupId
    subnetIds: !Split
      - ","
      - !ImportValue onebt-${self:provider.stage}-PrivateSubnetIds

  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: !ImportValue onebt-${self:provider.stage}-RdsEndpoint
    DB_PORT: !ImportValue onebt-${self:provider.stage}-RdsPort
    DB_NAME: !ImportValue onebt-${self:provider.stage}-DbName
    DB_SECRET_ARN: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: !ImportValue onebt-${self:provider.stage}-RdsSecretArn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn

  layers:
    - ${cf:onebt-shared-${self:provider.stage}.SharedLibsLayerArn}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"
    - "migrations/**"
    - "seeds/**"
    - "drizzle/**"

functions:
  # Run pending migrations and seeders
  runMigrations:
    handler: src/handlers/migrations.up
    description: Run pending database migrations and seeders
    events:
      # Can be triggered manually via AWS Console or CLI
      # aws lambda invoke --function-name onebt-migration-service-dev-runMigrations out.json

  # Get migration status
  getMigrationStatus:
    handler: src/handlers/migrations.status
    description: Get current migration status

  # Reset database (DEV ONLY - will destroy all data)
  resetDatabase:
    handler: src/handlers/migrations.reset
    description: Reset database schema (DEV ONLY - destroys all data)

  # Run only seeders (useful for refreshing seed data)
  runSeeders:
    handler: src/handlers/migrations.seed
    description: Run seeders to populate default data
