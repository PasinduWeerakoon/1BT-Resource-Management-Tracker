service: onebt-migration-service

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 300 # 5 minutes for migrations
  tags:
    Service: migration
    Project: 1BT-Resource-Management

  # VPC Configuration - default VPC (see /onebt/<stage>/lambda-*).
  # Moved off the onebt-infrastructure VPC exports so the app runs
  # alongside the RDS instance in the default VPC.
  vpc:
    securityGroupIds:
      - ${ssm:/onebt/${self:provider.stage}/lambda-security-group-id}
    subnetIds: ${ssm:/onebt/${self:provider.stage}/lambda-subnet-ids}

  environment:
    NODE_ENV: ${self:provider.stage}
    # DB endpoint via SSM: CloudFormation forbids changing an in-use export,
    # so repointing the DB is done by updating /onebt/<stage>/db-host.
    DB_HOST: ${ssm:/onebt/${self:provider.stage}/db-host}
    DB_PORT: ${ssm:/onebt/${self:provider.stage}/db-port}
    DB_NAME: ${ssm:/onebt/${self:provider.stage}/db-name}
    DB_SECRET_ARN: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
    AUDIT_QUEUE_URL: !ImportValue onebt-${self:provider.stage}-AuditQueueUrl

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: ${ssm:/onebt/${self:provider.stage}/db-secret-arn}
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !ImportValue onebt-${self:provider.stage}-AuditQueueArn

  layers:
    - ${self:custom.sharedLibsLayerArn}

custom:
  # Resolved at deploy time so the layer version is never pinned to a dead ARN.
  sharedLibsLayerArn: ${ssm:/onebt/shared/layer-arn/${self:provider.stage}}

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - "!.git/**"
    - "!.gitignore"
    - "!*.md"
    - "!tests/**"
    - "src/**"
    - "migrations/**"
    - "seeds/**"
    - "drizzle/**"

functions:
  # Run pending migrations and seeders
  runMigrations:
    handler: src/handlers/migrations.up
    description: Run pending database migrations and seeders
    events:
      # Can be triggered manually via AWS Console or CLI
      # aws lambda invoke --function-name onebt-migration-service-dev-runMigrations out.json

  # Get migration status
  getMigrationStatus:
    handler: src/handlers/migrations.status
    description: Get current migration status

  # Reset database (DEV ONLY - will destroy all data)
  resetDatabase:
    handler: src/handlers/migrations.reset
    description: Reset database schema (DEV ONLY - destroys all data)

  # Run only seeders (useful for refreshing seed data)
  runSeeders:
    handler: src/handlers/migrations.seed
    description: Run seeders to populate default data
