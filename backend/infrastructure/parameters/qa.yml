# =====================================================
# QA Environment Configuration
# =====================================================

# Environment
NODE_ENV: qa
LOG_LEVEL: debug

# Database Configuration
DATABASE_HOST: ${cf:1bt-rds-qa.RDSEndpoint}
DATABASE_PORT: 5432
DATABASE_NAME: resource_management_qa
DATABASE_USER: dbadmin
DATABASE_PASSWORD: ${ssm:/1bt/qa/db-password}

# VPC Configuration
VPC_ID: ${cf:1bt-vpc-qa.VPCId}
SUBNET_IDS:
  - ${cf:1bt-vpc-qa.PrivateSubnet1Id}
  - ${cf:1bt-vpc-qa.PrivateSubnet2Id}

# Security Group
LAMBDA_SECURITY_GROUP: ${cf:1bt-vpc-qa.LambdaSecurityGroupId}

# Encryption Key
ENCRYPTION_KEY: ${ssm:/1bt/qa/encryption-key}

# RDS Scheduler
RDS_SCHEDULER_ENABLED: true
RDS_INSTANCE_ID: ${cf:1bt-rds-qa.RDSInstanceId}

# Log Retention (days)
LOG_RETENTION_DAYS: 14

# CORS Origins
CORS_ORIGINS: 'https://qa.1bt-resource.com'

# Rate Limiting
RATE_LIMIT_MAX: 500
RATE_LIMIT_WINDOW: 60
