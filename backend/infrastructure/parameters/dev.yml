# =====================================================
# DEV Environment Configuration
# =====================================================
# Uses 'onebt-rm' prefix to comply with CloudFormation naming (must start with letter)

# Environment
NODE_ENV: development
LOG_LEVEL: debug

# Database Configuration (from CloudFormation Exports)
DATABASE_HOST: ${cf:onebt-rm-dev-rds.RDSEndpoint}
DATABASE_PORT: 5432
DATABASE_NAME: resource_management_dev
DATABASE_USER: dbadmin
DATABASE_PASSWORD: ${ssm:/1bt/dev/db-password}

# VPC Configuration (from CloudFormation Exports)
VPC_ID: ${cf:onebt-rm-dev-vpc.VPCId}
SUBNET_IDS:
  - ${cf:onebt-rm-dev-vpc.PrivateSubnet1Id}
  - ${cf:onebt-rm-dev-vpc.PrivateSubnet2Id}

# Security Group
LAMBDA_SECURITY_GROUP: ${cf:onebt-rm-dev-vpc.LambdaSecurityGroupId}

# Encryption Key
ENCRYPTION_KEY: ${ssm:/1bt/dev/encryption-key}

# RDS Scheduler
RDS_SCHEDULER_ENABLED: true
RDS_INSTANCE_ID: ${cf:onebt-rm-dev-rds.RDSInstanceId}

# Log Retention (days)
LOG_RETENTION_DAYS: 7

# CORS Origins
CORS_ORIGINS: '*'

# Rate Limiting
RATE_LIMIT_MAX: 1000
RATE_LIMIT_WINDOW: 60
