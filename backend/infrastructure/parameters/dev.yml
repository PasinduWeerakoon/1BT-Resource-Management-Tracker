# =====================================================
# DEV Environment Configuration
# =====================================================
# Simplified configuration with direct values for initial deployment

# Environment
NODE_ENV: development
LOG_LEVEL: debug

# Database Configuration
# Note: Get actual RDS endpoint after stack creation
DATABASE_HOST: placeholder-until-rds-ready
DATABASE_PORT: '5432'
DATABASE_NAME: resource_management_dev
DATABASE_USER: dbadmin
DATABASE_PASSWORD: placeholder

# VPC Configuration - Using outputs from VPC stack
# These will be populated after first VPC stack deployment
VPC_ID: placeholder
SUBNET_IDS: []

# Encryption Key
ENCRYPTION_KEY: placeholder-dev-encryption-key-32chars

# RDS Scheduler
RDS_SCHEDULER_ENABLED: false

# Log Retention (days)
LOG_RETENTION_DAYS: 7

# CORS Origins
CORS_ORIGINS: '*'

# Rate Limiting
RATE_LIMIT_MAX: 1000
RATE_LIMIT_WINDOW: 60
