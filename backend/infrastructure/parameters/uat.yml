# =====================================================
# UAT Environment Configuration
# =====================================================
# This file contains environment-specific variables for UAT (User Acceptance Testing)

# Environment
NODE_ENV: uat
LOG_LEVEL: info

# Database Configuration
DATABASE_HOST: your-uat-rds-endpoint.ap-south-1.rds.amazonaws.com
DATABASE_PORT: 5432
DATABASE_NAME: resource_management_uat
DATABASE_USER: uat_admin
DATABASE_PASSWORD: ${ssm:/1bt/uat/db-password}

# VPC Configuration
VPC_ID: vpc-xxxxxxxxxxxxxxxxx
SUBNET_IDS:
  - subnet-xxxxxxxxxxxxxxxxx
  - subnet-yyyyyyyyyyyyyyyyy

# Encryption Key
ENCRYPTION_KEY: ${ssm:/1bt/uat/encryption-key}

# RDS Scheduler (enabled for UAT to save costs)
RDS_SCHEDULER_ENABLED: true

# Log Retention (days)
LOG_RETENTION_DAYS: 30

# CORS Origins (specific domains for UAT)
CORS_ORIGINS: 'https://uat.1bt-resource.com,https://uat-admin.1bt-resource.com'

# Rate Limiting (production-like for UAT)
RATE_LIMIT_MAX: 200
RATE_LIMIT_WINDOW: 60
