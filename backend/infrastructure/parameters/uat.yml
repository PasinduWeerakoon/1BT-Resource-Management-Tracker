# ==============================================
# UAT Environment Parameters
# ==============================================
# Cost Estimate: ~$56/month (RDS + NAT Gateway)
# ==============================================

# Network Configuration
vpc:
  cidr: "10.2.0.0/16"
  publicSubnet1Cidr: "10.2.1.0/24"
  publicSubnet2Cidr: "10.2.2.0/24"
  privateSubnet1Cidr: "10.2.10.0/24"
  privateSubnet2Cidr: "10.2.11.0/24"
  databaseSubnet1Cidr: "10.2.20.0/24"
  databaseSubnet2Cidr: "10.2.21.0/24"

# NAT Gateway (enabled for UAT)
natGateway:
  enabled: true # ~$32/month
  multiAz: false # Single NAT to save cost

# RDS Database Configuration
database:
  instanceClass: db.t3.small # ~$24/month
  allocatedStorage: 30 # GB
  maxAllocatedStorage: 100 # GB (auto-scaling limit)
  backupRetentionDays: 7
  multiAz: false
  deletionProtection: true # Protect UAT data
  performanceInsights: false
  monitoringInterval: 0 # 0 = disabled

# Cognito Configuration
cognito:
  passwordMinLength: 12
  passwordRequireUppercase: true
  passwordRequireLowercase: true
  passwordRequireNumbers: true
  passwordRequireSymbols: true
  tempPasswordValidityDays: 7
  accessTokenValidityHours: 1
  idTokenValidityHours: 1
  refreshTokenValidityDays: 30

# API Gateway Configuration
apiGateway:
  throttlingBurstLimit: 1000
  throttlingRateLimit: 500
  corsMaxAge: 86400

# Feature Flags
features:
  vpcEndpoints: false # Disable VPC endpoints to save cost
  autoShutdown: false # Keep UAT running for testing
