# ==============================================
# PROD Environment Parameters
# ==============================================
# Cost Estimate: ~$15/month (RDS only, no NAT)
# ==============================================

# Network Configuration
vpc:
  cidr: "10.3.0.0/16"
  publicSubnet1Cidr: "10.3.1.0/24"
  publicSubnet2Cidr: "10.3.2.0/24"
  privateSubnet1Cidr: "10.3.10.0/24"
  privateSubnet2Cidr: "10.3.11.0/24"
  databaseSubnet1Cidr: "10.3.20.0/24"
  databaseSubnet2Cidr: "10.3.21.0/24"

# NAT Gateway (disabled to save ~$32/month)
natGateway:
  enabled: false
  multiAz: false

# RDS Database Configuration
database:
  instanceClass: db.t3.small # ~$15/month
  allocatedStorage: 20 # GB
  maxAllocatedStorage: 100 # GB (auto-scaling limit)
  backupRetentionDays: 7
  multiAz: false # Single AZ
  deletionProtection: true # Protect production data
  deletionPolicy: Retain # Never delete prod database
  performanceInsights: false
  monitoringInterval: 0 # Disabled

# Cognito Configuration
cognito:
  passwordMinLength: 12
  passwordRequireUppercase: true
  passwordRequireLowercase: true
  passwordRequireNumbers: true
  passwordRequireSymbols: true
  tempPasswordValidityDays: 7
  accessTokenValidityHours: 1
  idTokenValidityHours: 1
  refreshTokenValidityDays: 30

# API Gateway Configuration
apiGateway:
  throttlingBurstLimit: 500
  throttlingRateLimit: 250
  corsMaxAge: 86400

# Bastion Host (disabled for production)
bastion:
  enabled: false
  instanceType: t3.micro
  keyPairName: onebt-bastion-prod

# Feature Flags
features:
  vpcEndpoints: true # Enable VPC endpoints for Secrets Manager access
  autoShutdown: false # NEVER auto-shutdown production
