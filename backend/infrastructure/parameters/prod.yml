# =====================================================
# PRODUCTION Environment Configuration
# =====================================================
# CRITICAL: All secrets stored in SSM Parameter Store

# Environment
NODE_ENV: production
LOG_LEVEL: warn

# Database Configuration
DATABASE_HOST: ${cf:1bt-rds-prod.RDSEndpoint}
DATABASE_PORT: 5432
DATABASE_NAME: resource_management_prod
DATABASE_USER: dbadmin
DATABASE_PASSWORD: ${ssm:/1bt/prod/db-password}

# VPC Configuration
VPC_ID: ${cf:1bt-vpc-prod.VPCId}
SUBNET_IDS:
  - ${cf:1bt-vpc-prod.PrivateSubnet1Id}
  - ${cf:1bt-vpc-prod.PrivateSubnet2Id}

# Security Group
LAMBDA_SECURITY_GROUP: ${cf:1bt-vpc-prod.LambdaSecurityGroupId}

# Encryption Key
ENCRYPTION_KEY: ${ssm:/1bt/prod/encryption-key}

# RDS Scheduler (DISABLED for prod - 24/7 availability)
RDS_SCHEDULER_ENABLED: false
RDS_INSTANCE_ID: ${cf:1bt-rds-prod.RDSInstanceId}

# Log Retention (days) - Compliance requirement
LOG_RETENTION_DAYS: 90

# CORS Origins (production domains only)
CORS_ORIGINS: 'https://resource.1bt.com,https://admin.1bt.com'

# Rate Limiting (strict)
RATE_LIMIT_MAX: 100
RATE_LIMIT_WINDOW: 60
