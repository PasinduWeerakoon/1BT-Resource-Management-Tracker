# ==============================================
# PROD Environment Parameters
# ==============================================
# Cognito + API Gateway only.
#
# Networking and the database are no longer created by this stack - Lambdas run
# in the account's default VPC against an RDS instance managed outside
# CloudFormation. Those values are published as SSM parameters:
#   /onebt/prod/lambda-security-group-id, /onebt/prod/lambda-subnet-ids
#   /onebt/prod/db-host, /onebt/prod/db-port, /onebt/prod/db-name,
#   /onebt/prod/db-secret-arn
# ==============================================

# Cognito Configuration
cognito:
  passwordMinLength: 12
  passwordRequireUppercase: true
  passwordRequireLowercase: true
  passwordRequireNumbers: true
  passwordRequireSymbols: true
  tempPasswordValidityDays: 7
  accessTokenValidityHours: 1
  idTokenValidityHours: 1
  refreshTokenValidityDays: 30

# API Gateway Configuration
apiGateway:
  throttlingBurstLimit: 2000
  throttlingRateLimit: 1000
  corsMaxAge: 86400
