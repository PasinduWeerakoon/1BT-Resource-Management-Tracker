service: onebt-infrastructure

provider:
  name: aws
  region: ${opt:region, 'ap-southeast-1'}
  stage: ${opt:stage, 'dev'}
  stackName: onebt-infrastructure-${self:provider.stage}
  tags:
    Project: 1BT-Resource-Management
    Environment: ${self:provider.stage}
    ManagedBy: Serverless

# No Lambda functions - this is infrastructure only
# Use "resources" section for CloudFormation resources

custom:
  # Load environment-specific parameters from external files
  params: ${file(./parameters/${self:provider.stage}.yml)}

  # Shorthand references to loaded parameters
  cognito: ${self:custom.params.cognito}
  apiGateway: ${self:custom.params.apiGateway}

resources:
  Description: |
    1BT Resource Management - Shared Infrastructure Stack
    Cognito, API Gateway, Audit Queues

    NETWORKING & DATABASE ARE NOT MANAGED HERE.
    Lambdas run in the account's default VPC and talk to an RDS instance that
    lives there too. Both are managed outside CloudFormation and surfaced to the
    services through SSM parameters:
      /onebt/<stage>/lambda-security-group-id  (String)
      /onebt/<stage>/lambda-subnet-ids         (StringList)
      /onebt/<stage>/db-host                   (String)
      /onebt/<stage>/db-port                   (String)
      /onebt/<stage>/db-name                   (String)
      /onebt/<stage>/db-secret-arn             (String)
    Repointing the database is therefore an SSM update + service redeploy, with
    no cross-stack export to unwind.

  Resources:
    # ================================================================
    # COGNITO USER POOL
    # ================================================================

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: onebt-users-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        UsernameConfiguration:
          CaseSensitive: false
        Policies:
          PasswordPolicy:
            MinimumLength: ${self:custom.cognito.passwordMinLength}
            RequireUppercase: ${self:custom.cognito.passwordRequireUppercase}
            RequireLowercase: ${self:custom.cognito.passwordRequireLowercase}
            RequireNumbers: ${self:custom.cognito.passwordRequireNumbers}
            RequireSymbols: ${self:custom.cognito.passwordRequireSymbols}
            TemporaryPasswordValidityDays: ${self:custom.cognito.tempPasswordValidityDays}
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: false
        UserPoolTags:
          Environment: ${self:provider.stage}
          Project: 1BT-Resource-Management

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: onebt-web-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: ${self:custom.cognito.accessTokenValidityHours}
        IdTokenValidity: ${self:custom.cognito.idTokenValidityHours}
        RefreshTokenValidity: ${self:custom.cognito.refreshTokenValidityDays}
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # Cognito User Groups
    SuperAdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: SuperAdmin
        UserPoolId: !Ref CognitoUserPool
        Description: Super Administrators with full access

    AdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: Admin
        UserPoolId: !Ref CognitoUserPool
        Description: Administrators with configurable access

    UserGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: User
        UserPoolId: !Ref CognitoUserPool
        Description: Regular users with limited access

    # ================================================================
    # API GATEWAY (HTTP API v2)
    # ================================================================

    HttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: onebt-api-${self:provider.stage}
        ProtocolType: HTTP
        Description: 1BT Resource Management API - ${self:provider.stage}
        CorsConfiguration:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - Authorization
            - X-Amz-Date
            - X-Api-Key
            - X-Amz-Security-Token
          ExposeHeaders:
            - Content-Length
            - Content-Type
          MaxAge: ${self:custom.apiGateway.corsMaxAge}
        Tags:
          Environment: ${self:provider.stage}
          Project: 1BT-Resource-Management

    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref HttpApi
        StageName: ${self:provider.stage}
        AutoDeploy: true
        Description: ${self:provider.stage} stage
        DefaultRouteSettings:
          ThrottlingBurstLimit: ${self:custom.apiGateway.throttlingBurstLimit}
          ThrottlingRateLimit: ${self:custom.apiGateway.throttlingRateLimit}
        Tags:
          Environment: ${self:provider.stage}

    CognitoAuthorizer:
      Type: AWS::ApiGatewayV2::Authorizer
      Properties:
        ApiId: !Ref HttpApi
        AuthorizerType: JWT
        Name: onebt-cognito-auth-${self:provider.stage}
        IdentitySource:
          - "$request.header.Authorization"
        JwtConfiguration:
          Audience:
            - !Ref CognitoUserPoolClient
          Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

    # ================================================================
    # AUDIT TRAIL - SQS QUEUES
    # ================================================================

    # Dead Letter Queue for failed audit messages
    AuditDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: onebt-audit-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600 # 14 days
        Tags:
          - Key: Name
            Value: onebt-audit-dlq-${self:provider.stage}
          - Key: Environment
            Value: ${self:provider.stage}

    # Main Audit Queue
    AuditQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: onebt-audit-queue-${self:provider.stage}
        VisibilityTimeout: 60 # 6x Lambda timeout (10s)
        MessageRetentionPeriod: 345600 # 4 days
        ReceiveMessageWaitTimeSeconds: 20 # Long polling
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt AuditDeadLetterQueue.Arn
          maxReceiveCount: 3 # Retry 3 times before DLQ
        Tags:
          - Key: Name
            Value: onebt-audit-queue-${self:provider.stage}
          - Key: Environment
            Value: ${self:provider.stage}

  # ================================================================
  # OUTPUTS (Exported for microservices to import)
  #
  # Networking and database values are deliberately absent - they are
  # published as SSM parameters instead, so the database can be repointed
  # without CloudFormation refusing to change an in-use export.
  # ================================================================
  Outputs:
    # Cognito Outputs
    CognitoUserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: onebt-${self:provider.stage}-CognitoUserPoolId

    CognitoUserPoolArn:
      Description: Cognito User Pool ARN
      Value: !GetAtt CognitoUserPool.Arn
      Export:
        Name: onebt-${self:provider.stage}-CognitoUserPoolArn

    CognitoClientId:
      Description: Cognito Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: onebt-${self:provider.stage}-CognitoClientId

    CognitoIssuerUrl:
      Description: Cognito Issuer URL for JWT validation
      Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
      Export:
        Name: onebt-${self:provider.stage}-CognitoIssuerUrl

    # API Gateway Outputs
    HttpApiId:
      Description: HTTP API Gateway ID
      Value: !Ref HttpApi
      Export:
        Name: onebt-${self:provider.stage}-HttpApiId

    HttpApiEndpoint:
      Description: HTTP API Gateway Endpoint
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
      Export:
        Name: onebt-${self:provider.stage}-HttpApiEndpoint

    CognitoAuthorizerId:
      Description: Cognito Authorizer ID
      Value: !Ref CognitoAuthorizer
      Export:
        Name: onebt-${self:provider.stage}-CognitoAuthorizerId

    # Audit Queue Outputs
    AuditQueueUrl:
      Description: Audit Queue URL for sending audit events
      Value: !Ref AuditQueue
      Export:
        Name: onebt-${self:provider.stage}-AuditQueueUrl

    AuditQueueArn:
      Description: Audit Queue ARN for Lambda triggers and IAM
      Value: !GetAtt AuditQueue.Arn
      Export:
        Name: onebt-${self:provider.stage}-AuditQueueArn

    AuditDlqUrl:
      Description: Audit Dead Letter Queue URL for failed messages
      Value: !Ref AuditDeadLetterQueue
      Export:
        Name: onebt-${self:provider.stage}-AuditDlqUrl

    AuditDlqArn:
      Description: Audit Dead Letter Queue ARN
      Value: !GetAtt AuditDeadLetterQueue.Arn
      Export:
        Name: onebt-${self:provider.stage}-AuditDlqArn
