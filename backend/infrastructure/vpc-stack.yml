AWSTemplateFormatVersion: '2010-09-09'
Description: |
  1BT Resource Management - VPC Infrastructure
  Cost-Optimized Network Setup for Serverless Applications
  
  COST CONSIDERATIONS:
  - NAT Gateway: ~$32/month + data transfer (only in prod/uat)
  - VPC Endpoints: ~$7/endpoint/month (saves on data transfer)
  - Dev/QA: Uses NAT Gateway in single AZ to save costs
  - Prod: Multi-AZ for high availability

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod
    Description: Environment name

  EnableNATGateway:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable NAT Gateway (set false for dev to save ~$32/month, but Lambda won't have internet access)

  EnableMultiAZNAT:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy NAT Gateway in multiple AZs (recommended for prod only, doubles NAT cost)

Conditions:
  CreateNATGateway: !Equals [!Ref EnableNATGateway, 'true']
  CreateMultiAZNAT: !And
    - !Condition CreateNATGateway
    - !Equals [!Ref EnableMultiAZNAT, 'true']
  IsProd: !Equals [!Ref Environment, 'prod']

Mappings:
  # CIDR ranges per environment to avoid conflicts
  EnvironmentCIDR:
    dev:
      VPC: '10.0.0.0/16'
      PublicSubnet1: '10.0.1.0/24'
      PublicSubnet2: '10.0.2.0/24'
      PrivateSubnet1: '10.0.10.0/24'
      PrivateSubnet2: '10.0.11.0/24'
      DatabaseSubnet1: '10.0.20.0/24'
      DatabaseSubnet2: '10.0.21.0/24'
    qa:
      VPC: '10.1.0.0/16'
      PublicSubnet1: '10.1.1.0/24'
      PublicSubnet2: '10.1.2.0/24'
      PrivateSubnet1: '10.1.10.0/24'
      PrivateSubnet2: '10.1.11.0/24'
      DatabaseSubnet1: '10.1.20.0/24'
      DatabaseSubnet2: '10.1.21.0/24'
    uat:
      VPC: '10.2.0.0/16'
      PublicSubnet1: '10.2.1.0/24'
      PublicSubnet2: '10.2.2.0/24'
      PrivateSubnet1: '10.2.10.0/24'
      PrivateSubnet2: '10.2.11.0/24'
      DatabaseSubnet1: '10.2.20.0/24'
      DatabaseSubnet2: '10.2.21.0/24'
    prod:
      VPC: '10.3.0.0/16'
      PublicSubnet1: '10.3.1.0/24'
      PublicSubnet2: '10.3.2.0/24'
      PrivateSubnet1: '10.3.10.0/24'
      PrivateSubnet2: '10.3.11.0/24'
      DatabaseSubnet1: '10.3.20.0/24'
      DatabaseSubnet2: '10.3.21.0/24'

Resources:
  # ============================================
  # VPC
  # ============================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, VPC]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub onebt-vpc-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: 1BT-Resource-Management

  # ============================================
  # INTERNET GATEWAY
  # ============================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub onebt-igw-${Environment}
        - Key: Environment
          Value: !Ref Environment

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================
  # PUBLIC SUBNETS (for NAT Gateway, ALB if needed)
  # ============================================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, PublicSubnet1]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub onebt-public-subnet-1-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, PublicSubnet2]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub onebt-public-subnet-2-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Public

  # ============================================
  # PRIVATE SUBNETS (for Lambda functions)
  # ============================================
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, PrivateSubnet1]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onebt-private-subnet-1-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, PrivateSubnet2]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onebt-private-subnet-2-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Private

  # ============================================
  # DATABASE SUBNETS (isolated, for RDS)
  # ============================================
  DatabaseSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, DatabaseSubnet1]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onebt-db-subnet-1-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Database

  DatabaseSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [EnvironmentCIDR, !Ref Environment, DatabaseSubnet2]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub onebt-db-subnet-2-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Database

  # ============================================
  # NAT GATEWAY (Cost: ~$32/month + data transfer)
  # Only created if EnableNATGateway is true
  # ============================================
  NATGatewayEIP1:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub onebt-nat-eip-1-${Environment}

  NATGateway1:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub onebt-nat-1-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # Second NAT Gateway (only for prod with Multi-AZ)
  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    Condition: CreateMultiAZNAT
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub onebt-nat-eip-2-${Environment}

  NATGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateMultiAZNAT
    Properties:
      AllocationId: !GetAtt NATGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub onebt-nat-2-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # ROUTE TABLES
  # ============================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-public-rt-${Environment}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Private Route Table 1
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-private-rt-1-${Environment}

  PrivateRoute1:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NATGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  # Private Route Table 2
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-private-rt-2-${Environment}

  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !If [CreateMultiAZNAT, !Ref NATGateway2, !Ref NATGateway1]

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # Database Route Table (isolated - no internet access)
  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-db-rt-${Environment}

  DatabaseSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnet1
      RouteTableId: !Ref DatabaseRouteTable

  DatabaseSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnet2
      RouteTableId: !Ref DatabaseRouteTable

  # ============================================
  # VPC ENDPOINTS (Cost-saving: reduces NAT data transfer)
  # Each endpoint costs ~$7/month but saves on data transfer
  # ============================================
  
  # S3 Gateway Endpoint (FREE - no hourly charge)
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  # DynamoDB Gateway Endpoint (FREE - no hourly charge)
  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  # Secrets Manager Interface Endpoint (~$7/month - needed for DB credentials)
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsProd
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  # VPC Endpoint Security Group
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsProd
    Properties:
      GroupDescription: Security group for VPC Endpoints
      GroupName: !Sub onebt-vpce-sg-${Environment}
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !FindInMap [EnvironmentCIDR, !Ref Environment, VPC]
          Description: HTTPS from VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-vpce-sg-${Environment}

  # ============================================
  # RDS SUBNET GROUP
  # ============================================
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Subnet group for 1BT RDS - ${Environment}
      DBSubnetGroupName: !Sub onebt-db-subnet-group-${Environment}
      SubnetIds:
        - !Ref DatabaseSubnet1
        - !Ref DatabaseSubnet2
      Tags:
        - Key: Name
          Value: !Sub onebt-db-subnet-group-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # SECURITY GROUPS
  # ============================================
  
  # RDS Security Group (defined first)
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      GroupName: !Sub onebt-rds-sg-${Environment}
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub onebt-rds-sg-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # Lambda Security Group
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      GroupName: !Sub onebt-lambda-sg-${Environment}
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS services
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RDSSecurityGroup
          Description: PostgreSQL to RDS
      Tags:
        - Key: Name
          Value: !Sub onebt-lambda-sg-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # RDS Ingress Rule (defined separately to avoid circular dependency)
  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: PostgreSQL from Lambda

# ============================================
# OUTPUTS
# ============================================
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub onebt-rm-${Environment}-VPCId

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub onebt-rm-${Environment}-PublicSubnet1Id

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub onebt-rm-${Environment}-PublicSubnet2Id

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID (for Lambda)
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub onebt-rm-${Environment}-PrivateSubnet1Id

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID (for Lambda)
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub onebt-rm-${Environment}-PrivateSubnet2Id

  DatabaseSubnet1Id:
    Description: Database Subnet 1 ID
    Value: !Ref DatabaseSubnet1
    Export:
      Name: !Sub onebt-rm-${Environment}-DatabaseSubnet1Id

  DatabaseSubnet2Id:
    Description: Database Subnet 2 ID
    Value: !Ref DatabaseSubnet2
    Export:
      Name: !Sub onebt-rm-${Environment}-DatabaseSubnet2Id

  LambdaSecurityGroupId:
    Description: Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub onebt-rm-${Environment}-LambdaSecurityGroupId

  RDSSecurityGroupId:
    Description: RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub onebt-rm-${Environment}-RDSSecurityGroupId

  RDSSubnetGroupName:
    Description: RDS Subnet Group Name
    Value: !Ref RDSSubnetGroup
    Export:
      Name: !Sub onebt-rm-${Environment}-RDSSubnetGroupName

  PrivateSubnetIds:
    Description: Comma-separated list of private subnet IDs for Lambda
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub onebt-rm-${Environment}-PrivateSubnetIds

  # Cost Summary Output
  CostEstimate:
    Description: Estimated monthly VPC infrastructure cost
    Value: !If 
      - CreateNATGateway
      - !If 
        - CreateMultiAZNAT
        - 'NAT Gateway x2: ~$64/month + data transfer. VPC Endpoints in prod: ~$7/month'
        - 'NAT Gateway x1: ~$32/month + data transfer. Consider VPC endpoints for prod.'
      - 'No NAT Gateway: $0/month (Lambda cannot access internet, only VPC resources)'
