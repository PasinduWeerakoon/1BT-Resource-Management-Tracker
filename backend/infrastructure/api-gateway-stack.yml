AWSTemplateFormatVersion: "2010-09-09"
Description: |
  1BT Resource Management - Shared API Gateway
  Centralized API Gateway for all microservices

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

Resources:
  # ============================================
  # HTTP API (API Gateway v2 - faster & cheaper)
  # ============================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub onebt-api-${Environment}
      ProtocolType: HTTP
      Description: !Sub 1BT Resource Management API - ${Environment}
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        ExposeHeaders:
          - Content-Length
          - Content-Type
        MaxAge: 86400
      Tags:
        Environment: !Ref Environment
        Project: 1BT-Resource-Management

  # ============================================
  # API Stage
  # ============================================
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Environment
      AutoDeploy: true
      Description: !Sub ${Environment} stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 1000
        ThrottlingRateLimit: 500
      Tags:
        Environment: !Ref Environment

  # ============================================
  # Cognito Authorizer
  # ============================================
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: !Sub onebt-cognito-authorizer-${Environment}
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: !Sub onebt-rm-${Environment}-CognitoClientId
        Issuer:
          Fn::Sub:
            - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
            - UserPoolId:
                Fn::ImportValue: !Sub onebt-rm-${Environment}-CognitoUserPoolId

Outputs:
  HttpApiId:
    Description: HTTP API ID
    Value: !Ref HttpApi
    Export:
      Name: !Sub onebt-api-gateway-id-${Environment}

  HttpApiEndpoint:
    Description: HTTP API Endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub onebt-api-endpoint-${Environment}

  CognitoAuthorizerId:
    Description: Cognito Authorizer ID
    Value: !Ref CognitoAuthorizer
    Export:
      Name: !Sub onebt-cognito-authorizer-id-${Environment}
